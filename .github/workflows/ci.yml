name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose files are valid
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q
      - name: Proxy config is valid
        run: |
          mkdir -p "$RUNNER_TEMP/caddy"
          for site in 10.0.0.5 ribbon.lan ribbon.example.com; do
            docker run --rm -v "$PWD/deploy:/deploy:ro" -v "$RUNNER_TEMP/caddy:/out" \
              -e SITE_ADDRESS="$site" -e DRY_RUN=1 -e CADDYFILE_OUT=/out/Caddyfile caddy:2-alpine sh /deploy/caddy-entrypoint.sh
            docker run --rm -v "$RUNNER_TEMP/caddy:/out:ro" caddy:2-alpine caddy validate --config /out/Caddyfile --adapter caddyfile
          done
      - name: Production image builds and starts
        run: |
          docker build --target runner --build-arg GIT_COMMIT=${GITHUB_SHA} -t ribbon:ci .
          docker run -d --name ribbon-ci -p 8080:8080 ribbon:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs ribbon-ci
          exit 1
