# Build Ribbon from this checkout instead of pulling the published image:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# (Only the build is added here; ports, volume and settings come from docker-compose.yml.)
services:
  ribbon:
    build:
      context: .
      target: runner
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: ribbon:local
