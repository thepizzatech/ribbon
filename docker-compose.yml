# Ribbon, ready to run from the published image (no build needed):
#
#   docker compose up -d
#   open http://<this-machine>:8080
#
# Settings go in a .env file next to this one (see .env.example). Everything is optional.
# Your data lives in the "ribbon_data" volume (SQLite at /data/ribbon.db, nightly backups in /data/backups).
#
# Ribbon speaks plain HTTP on port 8080. For HTTPS, put it behind a reverse proxy
# (docs/REVERSE-PROXY.md) or add the Caddy overlay: docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
services:
  ribbon:
    image: ghcr.io/thepizzatech/ribbon:${RIBBON_TAG:-latest}
    restart: unless-stopped
    # Ribbon needs no extra privileges: drop every Linux capability and forbid gaining new ones.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ribbon_data:/data
    environment:
      DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      ALLOW_INSECURE_LOGIN: ${ALLOW_INSECURE_LOGIN:-}
      HSTS: ${HSTS:-}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-false}
      SETUP_CODE: ${SETUP_CODE:-}
      ALLOW_PUBLIC_SETUP: ${ALLOW_PUBLIC_SETUP:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      TOUR_ALWAYS: ${TOUR_ALWAYS:-}
      TOUR_IN_DEV: ${TOUR_IN_DEV:-}
      BACKUP_CRON: ${BACKUP_CRON:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_AUTO_LINK_BY_EMAIL: ${OIDC_AUTO_LINK_BY_EMAIL:-}
      OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-}
      DISABLE_PASSWORD_LOGIN: ${DISABLE_PASSWORD_LOGIN:-}

volumes:
  ribbon_data:
