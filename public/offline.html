<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ribbon is offline</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #f5f6f8; color: #111827; }
  @media (prefers-color-scheme: dark) { body { background: #0b0d10; color: #f3f4f6; } p { color: #9ca3af !important; } }
  main { max-width: 22rem; text-align: center; }
  h1 { font-size: 1.25rem; margin: 16px 0 8px; }
  p { margin: 0 0 20px; color: #6b7280; }
  button { min-height: 44px; border: 0; border-radius: 999px; padding: 0 22px; background: #1c1917; color: #f3efe8; font: inherit; font-weight: 500; cursor: pointer; }
  img { width: 56px; height: 56px; border-radius: 14px; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1>Ribbon can’t reach your server</h1>
  <p>Your gift list lives on your own server, so it needs a connection. Check your network or that the server is running, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
