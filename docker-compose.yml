# Local test from VS Code / Docker Desktop, or an Ubuntu host.
#   docker compose up --build
# Then open http://localhost:8080
# Source is mounted, so edits in VS Code show up in the container.
services:
  ribbon:
    build:
      context: .
      target: dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ribbon_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

volumes:
  ribbon_modules:
