# Development: hot reload with your source mounted in.
#   docker compose up --build
# Then open http://localhost:8080
# Your ledger lives in the "ribbon_dev_data" volume (SQLite file at /data/ribbon.db).
services:
  ribbon:
    build:
      context: .
      target: dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ribbon_modules:/app/node_modules
      - ribbon_dev_data:/data
    environment:
      CHOKIDAR_USEPOLLING: "true"
      DATA_DIR: /data
      APP_PASSCODE: ${APP_PASSCODE:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  ribbon_modules:
  ribbon_dev_data:
