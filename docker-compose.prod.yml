# Production / self-hosting, with HTTPS in front (Caddy):
#   docker compose -f docker-compose.prod.yml up -d --build
# Then open https://<SITE_ADDRESS>  (see README: "Run it for your family").
#
# Settings go in a .env file next to this one (all optional except SITE_ADDRESS in practice):
#   SITE_ADDRESS   the address people type: ribbon.example.com, ribbon.lan or 10.15.40.16 (default: localhost)
#   HTTP_PORT      host port for plain HTTP, only used to redirect to HTTPS (default 80)
#   HTTPS_PORT     host port for HTTPS (default 443)
#   TLS_MODE       auto | internal | acme (default auto; see README)
#   ACME_EMAIL     contact email for Let's Encrypt
#   SETUP_CODE     if set, whoever creates the first (owner) login must type it
#   XAI_API_KEY    turns on the Ask page
#
# Only Caddy publishes ports. The app is reachable from Caddy only, on the compose network.
# Your ledger lives in the "ribbon_data" volume (SQLite file at /data/ribbon.db).
services:
  ribbon:
    build:
      context: .
      target: runner
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: ${RIBBON_IMAGE:-ribbon:latest}
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ribbon_data:/data
    environment:
      DATA_DIR: /data
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-false}
      ENFORCE_HTTPS: ${ENFORCE_HTTPS:-true}
      SETUP_CODE: ${SETUP_CODE:-}
      XAI_API_KEY: ${XAI_API_KEY:-}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      ribbon:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/deploy/caddy-entrypoint.sh"]
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      TLS_MODE: ${TLS_MODE:-auto}
      ACME_EMAIL: ${ACME_EMAIL:-}
      UPSTREAM: ribbon:8080
    volumes:
      - ./deploy/caddy-entrypoint.sh:/deploy/caddy-entrypoint.sh:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  ribbon_data:
  caddy_data:
  caddy_config:
